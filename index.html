<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>כמה עו"ד: קריירה משפטית למשפטן המתחיל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0b; --card: #17181c; --card-2: #1f2025;
    --border: #2a2b31; --border-soft: #202126;
    --text: #f2f2f4; --text-dim: #9a9aa3; --text-faint: #8a8a92;
    --accent: #d1a53d; --accent-soft: rgba(209,165,61,.14); --accent-text: #17181c;
    --good: #4fb473; --bad: #e2584f;
    --font-display: 'Rubik', sans-serif; --font-body: 'Heebo', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; padding:22px 14px 50px; direction:rtl; }
  .wrap{ max-width:560px; margin:0 auto; }
  .brand{ text-align:center; margin-bottom:20px; }
  .brand .eyebrow{ font-size:11px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; font-weight:700; margin-bottom:6px;}
  .brand h1{ font-family:var(--font-display); font-weight:900; font-size:26px; margin:0; }
  .brand .tag{ color:var(--text-dim); font-size:13px; margin-top:5px; }
  .disclaimer-short{ font-size:11px; color:var(--text-faint); line-height:1.5; text-align:center; margin:18px auto 0; padding:0 10px; max-width:480px; }
  .disclaimer-full{ font-size:10.5px; color:var(--text-faint); line-height:1.6; text-align:center; margin-top:16px; padding:0 4px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px 18px; margin-bottom:14px; }
  h2.card-title{ font-family:var(--font-display); font-size:17px; font-weight:800; margin:0 0 4px; }
  p.card-sub{ font-size:13px; color:var(--text-dim); margin:0 0 16px; line-height:1.55; }
  .origin-grid{ display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
  .origin-card{ border:1.5px solid var(--border); background:var(--card-2); border-radius:14px; padding:13px 14px; cursor:pointer; text-align:right; transition:border-color .15s, background .15s; }
  .origin-card:hover{ border-color:var(--accent); }
  .origin-card.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .origin-card .ot{ font-family:var(--font-display); font-weight:700; font-size:15px; margin-bottom:3px;}
  .origin-card .od{ font-size:12px; color:var(--text-dim); line-height:1.5;}
  .origin-mini{ display:grid; grid-template-columns:1fr 1fr; gap:5px 10px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--border); font-size:10.5px; color:var(--text-faint); line-height:1.4; }
  .gender-grid{ display:flex; gap:9px; margin-bottom:18px; }
  .gender-card{ flex:1; border:1.5px solid var(--border); background:var(--card-2); border-radius:14px; padding:20px 10px; text-align:center; cursor:pointer; font-family:var(--font-display); font-weight:700; font-size:15px; }
  .gender-card.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .pill-row{ display:flex; gap:8px; margin-bottom:20px; }
  .pill{ flex:1; text-align:center; padding:11px 6px; border-radius:12px; border:1.5px solid var(--border); background:var(--card-2); font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer; }
  .pill.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .btn{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:15px 18px; border-radius:14px; border:none; cursor:pointer; font-family:var(--font-display); font-weight:800; font-size:15px; background:var(--accent); color:var(--accent-text); transition:transform .08s, filter .15s; }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn.secondary{ background:var(--card-2); color:var(--text); border:1.5px solid var(--border); }
  .btn.secondary:hover{ border-color:var(--accent); filter:none; }
  .btn-row{ display:flex; gap:9px; }
  .btn-row .btn{ flex:1; }
  .link-btn{ background:none; border:none; color:var(--accent); font-family:var(--font-body); font-size:13px; font-weight:600; cursor:pointer; }
  .player-card{ background:linear-gradient(160deg, var(--card-2), var(--card)); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; }
  .player-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  .player-name{ font-size:11px; color:var(--accent); font-weight:700; margin-bottom:2px; }
  .player-role{ font-family:var(--font-display); font-weight:800; font-size:19px; }
  .player-place{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .year-badge{ background:var(--accent-soft); color:var(--accent); font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:20px; white-space:nowrap; }
  .level-dots{ display:flex; gap:5px; margin-top:10px; }
  .level-dot{ width:100%; height:5px; border-radius:3px; background:var(--border); }
  .level-dot.filled{ background:var(--accent); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .stat-chip{ background:var(--card-2); border:1px solid var(--border-soft); border-radius:12px; padding:9px 6px; text-align:center; }
  .stat-chip .sl{ font-size:10px; color:var(--text-faint); margin-bottom:3px; letter-spacing:.02em;}
  .stat-chip .sv{ font-family:var(--font-display); font-weight:800; font-size:15px; }
  .stat-bar{ height:4px; background:var(--border); margin-top:6px; border-radius:2px; overflow:hidden; }
  .stat-bar-fill{ height:100%; background:var(--accent); transition:width .4s; }
  .rank-line{ font-size:11.5px; color:var(--text-dim); text-align:center; padding-top:6px; border-top:1px dashed var(--border); }
  .bdi-inline{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
  .bdi-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .bdi-tier-inline{ font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--accent); }
  .bdi-sub{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
  .rank-line b{ color:var(--text); }
  .log{ max-height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .log-entry{ font-size:13px; line-height:1.5; padding:10px 12px; background:var(--card-2); border-radius:10px; border-right:3px solid var(--border); }
  .log-entry.good{ border-right-color:var(--good); }
  .log-entry.bad{ border-right-color:var(--bad); }
  .log-entry .lg-year{ font-weight:700; color:var(--text-faint); font-size:10.5px; display:block; margin-bottom:3px; }
  .log-entry .lg-delta{ font-size:11px; color:var(--accent); margin-top:5px; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ background:var(--card); border:1px solid var(--border); max-width:460px; width:100%; padding:22px 20px; border-radius:20px; max-height:88vh; overflow-y:auto; }
  .modal .badge{ display:inline-block; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:20px; margin-bottom:12px; }
  .modal h3{ font-family:var(--font-display); font-size:18px; margin:0 0 10px; }
  .modal p.situation{ font-size:13.5px; line-height:1.6; color:var(--text-dim); margin:0 0 16px; }
  .choice-btn{ display:block; width:100%; text-align:right; padding:13px 14px; margin-bottom:8px; background:var(--card-2); border:1.5px solid var(--border); border-radius:12px; cursor:pointer; font-family:var(--font-body); font-size:13.5px; color:var(--text); line-height:1.4; }
  .choice-btn:hover{ border-color:var(--accent); }
  .choice-btn .cf{ display:block; font-size:11px; color:var(--text-faint); margin-top:3px; }
  .odds-row{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .odds-pill{ display:inline-block; padding:4px 9px; border-radius:9px; font-size:10.5px; line-height:1.4; }
  .odds-pill.good{ background:rgba(79,180,115,.14); color:var(--good); border:1px solid rgba(79,180,115,.4); }
  .odds-pill.bad{ background:rgba(226,88,79,.14); color:var(--bad); border:1px solid rgba(226,88,79,.4); }
  .odds-pill.mid{ background:var(--accent-soft); color:var(--accent); border:1px solid rgba(209,165,61,.4); }
  .dice-roll{ font-size:52px; display:inline-block; animation: diceSpin .55s ease-in-out; }
  @keyframes diceSpin{ 0%{ transform:rotate(0deg) scale(1); } 50%{ transform:rotate(200deg) scale(1.3); } 100%{ transform:rotate(360deg) scale(1); } }
  .end-badge{ display:block; margin:2px auto 16px; text-align:center; width:fit-content; background:var(--accent); color:var(--accent-text); font-family:var(--font-display); font-weight:800; font-size:13px; padding:8px 18px; border-radius:20px; }
  .end-title{ font-family:var(--font-display); font-size:22px; font-weight:900; text-align:center; margin:0 0 10px; }
  .end-desc{ font-size:14px; line-height:1.65; color:var(--text-dim); text-align:center; margin-bottom:18px; }
  .coll-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .coll-card{ border:1.5px solid var(--border); background:var(--card-2); border-radius:12px; padding:12px 10px; text-align:center; min-height:88px; display:flex; flex-direction:column; justify-content:center; }
  .coll-card.unlocked{ border-color:var(--accent); background:var(--accent-soft); }
  .coll-card .ct{ font-family:var(--font-display); font-weight:700; font-size:12.5px; margin-bottom:3px; }
  .coll-card .cd{ font-size:10px; color:var(--text-dim); line-height:1.4; }
  .coll-card.locked .ct, .coll-card.locked .cd{ color:var(--text-faint); }
  .coll-count{ text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:16px; }
  .timeline{ position:relative; padding-right:26px; }
  .timeline::before{ content:''; position:absolute; right:9px; top:4px; bottom:4px; width:2px; background:linear-gradient(var(--accent), var(--border)); border-radius:2px; }
  .timeline-item{ position:relative; margin-bottom:14px; background:var(--card-2); border:1px solid var(--border-soft); border-radius:14px; padding:12px 14px; }
  .timeline-item::before{ content:''; position:absolute; right:-26px; top:16px; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); box-shadow:0 0 0 2px var(--accent); }
  .timeline-item .ty{ font-size:10.5px; font-weight:700; color:var(--accent); margin-bottom:3px; }
  .timeline-item .tr{ font-family:var(--font-display); font-weight:700; font-size:13.5px; margin-bottom:2px; }
  .timeline-item .tp{ font-size:11px; color:var(--text-dim); }
  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
  @media (max-width:400px){ .brand h1{ font-size:22px; } .stat-chip .sv{ font-size:13px; } }
</style>
</head>

function workplaceCategory(wp){
  if(['small_firm','large_firm','mega_firm','independent'].includes(wp)) return 'firm';
  if(wp==='judge') return 'judge';
  if(wp==='politics') return 'politics';
  if(wp==='academic') return 'academic';
  if(wp==='corporate') return 'corporate';
  if(['bagatz','ngo','bituach_leumi','regulatory'].includes(wp)) return 'public';
  if(['court_supreme','court_district'].includes(wp)) return 'clerk';
  if(wp==='mediator') return 'mediator';
}

async function loadCollection(){
  try{
    const res = await window.storage.get('legal_career_collection', false);
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    if(!parsed) { collection = { endings:[], gamesPlayed:0, fastestRun:null, lowSanitySurvivor:false }; }
    else if(Array.isArray(parsed)) { collection = { endings:parsed, gamesPlayed:parsed.length, fastestRun:null, lowSanitySurvivor:false }; }
    else { collection = { endings:parsed.endings||[], gamesPlayed:parsed.gamesPlayed||0, fastestRun:parsed.fastestRun!=null?parsed.fastestRun:null, lowSanitySurvivor:!!parsed.lowSanitySurvivor }; }
  } catch(e){ collection = { endings:[], gamesPlayed:0, fastestRun:null, lowSanitySurvivor:false }; }

function recordGameEnd(){
  collection.gamesPlayed = (collection.gamesPlayed||0) + 1;
  const yrs = seniorityYears(state.year);
  if(collection.fastestRun==null || yrs < collection.fastestRun) collection.fastestRun = yrs;

  saveCollection();
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function pickOutcome(outcomes){ const r=Math.random(); let acc=0; for(const o of outcomes){ acc+=o.p; if(r<=acc) return o; } return outcomes[outcomes.length-1]; }
function genderize(str, gender){ return str.replace(/([\u0590-\u05FF]+)\/([\u0590-\u05FF]+)/g, (m,base,suf)=> gender==='f' ? base+suf : base); }

function weightedPickWithoutReplacement(items, weightFn, k){
  const pool = items.map(it=>({it, w:Math.max(0.01,weightFn(it))}));
  const result=[];
  for(let n=0;n<k && pool.length>0;n++){
    const total = pool.reduce((s,p)=>s+p.w,0);
    let r = Math.random()*total, idx=0;
    for(;idx<pool.length;idx++){ r-=pool[idx].w; if(r<=0) break; }
    idx = Math.min(idx, pool.length-1);
    result.push(pool[idx].it);
    pool.splice(idx,1);
  }
  return result;
}

function deltaText(d){
  if(!d) return '';
  const parts=[];
  if(d.rep) parts.push(`מוניטין מקצועי ${d.rep>0?'+':''}${d.rep}`);
  if(d.publicRep) parts.push(`תדמית ציבורית ${d.publicRep>0?'+':''}${d.publicRep}`);
  if(d.money) parts.push(`הון ${d.money>0?'+':''}${d.money.toLocaleString('he-IL')} ₪`);
  if(d.sanity) parts.push(`שפיות ${d.sanity>0?'+':''}${d.sanity}`);
  if(d.network) parts.push(`קשרים ${d.network>0?'+':''}${d.network}`);
  if(d.firmRank) parts.push(`דירוג משרד ${d.firmRank>0?'+':''}${d.firmRank}`);
  if(d.deptRank) parts.push(`דירוג מחלקה ${d.deptRank>0?'+':''}${d.deptRank}`);
  return parts.join(' · ');
}

function applyDelta(d){
  if(!d) return;
  if(d.rep) state.rep = clamp(state.rep + d.rep);
  if(d.publicRep) state.publicRep = clamp(state.publicRep + d.publicRep);
  if(d.sanity) state.sanity = clamp(state.sanity + d.sanity);
  if(d.network) state.network = clamp(state.network + d.network);
  if(d.money) state.money += d.money;
  if(d.firmRank!=null && state.firmRank!=null) state.firmRank = clamp(state.firmRank + d.firmRank);
  if(d.deptRank!=null && state.deptRank!=null) state.deptRank = clamp(state.deptRank + d.deptRank);
}

// spend network to tilt the odds toward the best branch of a chosen option
function boostOutcomes(outcomes){
  if(!outcomes || outcomes.length<2) return outcomes;
  let bestIdx=0, bestScore=-Infinity;
  outcomes.forEach((o,i)=>{ const s=sumDelta(o.d); if(s>bestScore){ bestScore=s; bestIdx=i; } });
  const boostAmt = Math.min(0.15, 1-outcomes[bestIdx].p);
  const others = outcomes.map((o,i)=>i).filter(i=>i!==bestIdx);
  const othersTotal = others.reduce((s,i)=>s+outcomes[i].p,0);
  return outcomes.map((o,i)=>{
    if(i===bestIdx) return {...o, p: o.p+boostAmt};
    if(othersTotal<=0) return o;
    return {...o, p: o.p - boostAmt*(o.p/othersTotal)};
  });
}

function salaryFor(workplace, level){ const wp=WORKPLACES[workplace]; return wp.salaries[level] || 0; }
function netSalaryFor(workplace, level){
  const gross = salaryFor(workplace, level);
  let rate;
  if(gross<=8000) rate=0.90;
  else if(gross<=15000) rate=0.80;
  else if(gross<=25000) rate=0.72;
  else if(gross<=40000) rate=0.65;
  else rate=0.58;
  return Math.round(gross*rate);
}

function seniorityLabel(year){ return year<=1 ? 'התמחות' : `שנת ותק ${year-2}`; }

  const last = state.careerPath[state.careerPath.length-1];
  const role = roleTitle(), place = placeLineText();
  if(last && last.role===role && last.place===place) return;
  state.careerPath.push({year:state.year, role, place});
}

function checkEligible(d, s){
  if(d.minYear && s.year < d.minYear) return false;
  if(d.minLevel!=null && s.level < d.minLevel) return false;
  if(d.maxLevel!=null && s.level > d.maxLevel) return false;
  if(d.minRep!=null && s.rep < d.minRep) return false;
  if(d.minNetwork!=null && s.network < d.minNetwork) return false;
  if(d.categories && !d.categories.includes(workplaceCategory(s.workplace))) return false;
  if(d.excludeWorkplace && d.excludeWorkplace.includes(s.workplace)) return false;
  if(d.isMajorMove && (s.year - (s.lastMoveYear||0)) < 3) return false;
  if(d.eligible && !d.eligible(s)) return false;
  return true;
}

function drawDecision(){
  const elig = DECISIONS.filter(d=>checkEligible(d,state));
  let pool = elig.filter(d=>!state.recentDecisionIds.includes(d.id));
  if(pool.length===0) pool = elig;
  if(pool.length===0){
    // safety net: should not happen (life_event/dating_time have no restrictions), but never crash
    return { id:'quiet_moment', title:'רגע שקט', situation:'יום רגיל בעבודה, בלי דרמות מיוחדות.',
      options:[{ label:'להמשיך הלאה', outcomes:[{p:1, text:'עוד יום עבר.', d:{sanity:1}}] }] };
  }
  const boosted = (state.eliteSchool||state.hadSupremeClerkship);
  const weightFn = (d)=>{
    let w = 1;
    if(boosted && d.id==='academic_offer') w *= 4;
    if(state.department && d.depts && d.depts.includes(state.department)) w *= 2.5;
    if(d.id==='quit_to_tech') w *= 0.4;
    return w;
  };
  let [pick] = weightedPickWithoutReplacement(pool, weightFn, 1);
  state.recentDecisionIds.push(pick.id);
  if(state.recentDecisionIds.length>6) state.recentDecisionIds.shift();
  if(pick.id==='quit_to_tech'){
    const n = state.flags.quitOffers||0;
    state.flags.quitOffers = n+1;
    if(pick.situationVariants){ pick = {...pick, situation: pick.situationVariants[Math.min(n, pick.situationVariants.length-1)]}; }
  }
  return pick;
}

const MONEY_MILESTONES = [
  { threshold:150000, flag:'ms_car', text:'💰 צברת מספיק להורדה ראשונה על רכב סביר. לא יוקרתי. סביר.' },

  { threshold:2500000, flag:'ms_mortgage', text:'💰 המשכנתא כבר לא מפחידה אותך כמו שהיא הפחידה בהתחלה.' },

  { threshold:-50000, flag:'ms_debt1', text:'💸 חברת האשראי מתחילה להתקשר אליך, לא רק אתה אליה.' },
  { threshold:-150000, flag:'ms_debt2', text:'💸 את/ה נמנע/ת מלבדוק את חשבון הבנק בבוקר. זה לא נעלם ככה.' },
];
function checkMoneyMilestones(){
  for(const m of MONEY_MILESTONES){
    if(state.flags[m.flag]) continue;
    if(m.threshold>0 && state.money>=m.threshold){ state.flags[m.flag]=true; state.log.unshift({year:state.year, text:m.text, cls:'good', score:3}); }
    if(m.threshold<0 && state.money<=m.threshold){ state.flags[m.flag]=true; state.log.unshift({year:state.year, text:m.text, cls:'bad', score:-3}); }
  }
}

function finishTurn(){
  checkMoneyMilestones();
  state.history.push({year:state.year, rep:state.rep, money:state.money, sanity:state.sanity, network:state.network, publicRep:state.publicRep});
  const forced = checkForcedEnd();
  if(forced){ endGame(forced); return; }
  if(state.year >= MAX_YEARS){ endGame(evaluateEnding()); return; }
  render();
}
function checkForcedEnd(){
  if(state.sanity<=0) return 'breakdown';
  if(state.flags.suspended && state.rep<=5) return 'thailand';
  if(state.flags.suspended && state.rep<(state.hardMode?20:15)) return 'disbarred';
  return null;
}
function evaluateEnding(){
  const {workplace, level, rep, network, sanity, publicRep} = state;
  if(state.retiredEarly && state.sanity>=60 && !['judge','politics','academic'].includes(workplace)) return 'fire_retirement';
  if(workplace==='judge' && level>=2) return 'supreme_court_judge';
  if(workplace==='judge') return 'local_judge';
  if(workplace==='politics' && level>=1) return 'knesset_member';
  if(workplace==='politics') return 'failed_politician';
  if(workplace==='academic' && level>=4) return 'dean';
  if(workplace==='academic' && level>=2) return 'professor';
  if(workplace==='academic') return 'adjunct_forever';
  if(workplace==='corporate' && level>=2) return 'unicorn_counsel';
  if(workplace==='corporate') return 'corporate_burnout';
  if(workplace==='mediator') return 'mediator_zen';
  if(publicRep>=85 && rep<50) return 'legal_influencer';
  if(publicRep<=15) return 'cancelled';
  if(state.flags.wonBigClassAction) return 'litigation_billionaire';
  if(rep>=85 && network>=70) return 'bar_president';
  if(workplace==='independent' && rep>=50) return 'firm_founder';
  if(workplace==='bituach_leumi') return 'bituach_leumi_lifer';
  if(workplace==='ngo' && rep>=40) return 'ngo_hero';
  if(sanity<=25) return 'burnt_out_escape';
  if(rep<=15) return 'quiet_failure';
  return 'quiet_survivor';
}
function endGame(id){ state.ended=true; state.endingId=id; unlockEnding(id); recordGameEnd(); render(); }
function retireNow(){ state.retiredEarly = true; endGame(evaluateEnding()); }

function newState(originId, interval, hardMode){
  const o = ORIGINS.find(x=>x.id===originId);
  const judgeName = originId==='court_supreme' ? JUDGE_NAMES[Math.floor(Math.random()*JUDGE_NAMES.length)] : null;
  const st = {
    origin:originId, interval, year:1, hardMode: !!hardMode,
    workplace:originId, level:0, department:null,
    rep:clamp(o.start.rep), publicRep:50, money:0, sanity:clamp(hardMode ? o.start.sanity-10 : o.start.sanity), network:clamp(o.start.network),
    firmRank: WORKPLACES[originId].hasDept ? WORKPLACES[originId].firmRankBase : null,
    deptRank: null, flags:{}, retiredEarly:false, lowSanityStreak:0, gotLowSanityAchievement:false,
    judgeName: judgeName,
    log:[{year:1, text:o.internDesc + (judgeName ? ` את/ה מתמחה אצל השופט/ת ${judgeName}.` : ''), cls:''}],
    careerPath: [{year:1, role: 'מתמחה', place: o.name}],
    recentDecisionIds:[],
    needsOfferResolution:true, needsJobSearch:false, clerkshipExtended:false,
    ended:false, endingId:null, pendingEvent:null, pendingKind:null,
    school: chosenSchool.id, eliteSchool: chosenSchool.tier>=3, goal: chosenGoal,
    hadSupremeClerkship: originId==='court_supreme',
    gender: playerGender, name: playerName, lastMoveYear:1, barInvest:0, barEnjoy:0, barBias:0, pendingDecisionsCount:0,
    history: [],
  };
  st.money += netSalaryFor(st.workplace, st.level) * 12;
  st.history.push({year:1, rep:st.rep, money:st.money, sanity:st.sanity, network:st.network, publicRep:st.publicRep});
  return st;
}

function advanceYear(){
  state.year++;
  state.money += netSalaryFor(state.workplace, state.level) * 12;
  const decayEvery = state.hardMode ? 1 : 2;
  if(state.year % decayEvery === 0) state.network = clamp(state.network - 1); // relationships need upkeep
  if(state.sanity < 10){ state.lowSanityStreak++; if(state.lowSanityStreak>=5) state.gotLowSanityAchievement = true; }
  else state.lowSanityStreak = 0;

  if(state.needsOfferResolution){
    state.needsOfferResolution = false;
    state.pendingEvent = offerResolutionEvent(); state.pendingKind = 'offer';
    render(); return;
  }
  if(state.needsJobSearch){
    state.needsJobSearch = false;
    state.pendingEvent = jobSearchEvent(); state.pendingKind = 'normal';
    render(); return;
  }
  if(isClerkship(state.workplace) && state.level>=1 && !state.clerkshipExtended){
    state.clerkshipExtended = true;
    state.pendingEvent = clerkshipEndEvent(); state.pendingKind = 'normal';
    render(); return;
  }
  let decisionsThisTurn = 0;
  if(state.interval === 0){ decisionsThisTurn = 3; }
  else if((state.year - 2) >= 0 && (state.year - 2) % state.interval === 0){ decisionsThisTurn = 1; }
  if(decisionsThisTurn > 0){
    state.pendingDecisionsCount = decisionsThisTurn;
    if(WORKPLACES[state.workplace].hasDept && !state.department && state.year>=3 && Math.random()<0.4){
      state.pendingEvent = departmentEvent(); state.pendingKind = 'department';
      render(); return;
    }
    state.pendingEvent = drawDecision(); state.pendingKind = 'normal';
    render(); return;
  }
  const flavorPool = FLAVOR_EVENTS.filter(f=> !f.categories || f.categories.includes(workplaceCategory(state.workplace)));
  const ev = flavorPool[Math.floor(Math.random()*flavorPool.length)];
  applyDelta(ev.d);
  state.log.unshift({year:state.year, text:ev.text, cls: sumDelta(ev.d)>=0?'good':'bad', deltaStr: deltaText(ev.d), score: sumDelta(ev.d)});
  finishTurn();
}

function sumDelta(d){ if(!d) return 0; return (d.rep||0)+(d.sanity||0)+(d.network||0)+((d.money||0)/2000)+(d.firmRank||0)+(d.deptRank||0); }

function resolveNarrativeOnly(){
  const ev = state.pendingEvent;
  const cls = ev.id==='formal_pass' ? 'good' : (ev.id==='offer_none' || ev.id==='formal_fail') ? 'bad' : '';
  const score = ev.id==='formal_pass' ? 6 : (ev.id==='offer_none' || ev.id==='formal_fail') ? -4 : 0;
  state.log.unshift({year:state.year, text:ev.situation, cls, score, milestone:true});
  if(ev.autoLevelUp){ state.level = Math.min(state.level+ev.autoLevelUp, WORKPLACES[state.workplace].ladder.length-1); recordCareerStep(); }
  if(ev.autoJobSearch || ev.id==='offer_none'){ state.needsJobSearch = true; }
  state.pendingEvent = null;
  finishTurn();
}

// Computes and APPLIES the outcome of a choice, but does not advance the game flow —
// that happens in proceedAfterChoice(), once the player has seen the result on screen.
function computeChoice(optIndex, boostOn){
  const ev = state.pendingEvent; const kind = state.pendingKind;

  if(kind==='department'){
    const opt = ev.options[optIndex];
    state.department = opt.deptId; state.deptRank = 40;
    applyDelta(opt.d);
    const score = sumDelta(opt.d);
    const text = `הצטרפת למחלקת ${opt.label}. ${opt.sub}`;
    state.log.unshift({year:state.year, text, cls: score>=0?'good':'bad', deltaStr: deltaText(opt.d), score});
    recordCareerStep();
    return { text, cls: score>=0?'good':'bad', deltaStr: deltaText(opt.d), next:'finish' };
  }
  if(kind==='intern_dilemma'){
    const opt = ev.options[optIndex];
    const outcome = opt.outcomes[0];
    applyDelta(outcome.d);
    const score = sumDelta(outcome.d);
    state.log.unshift({year:1, text:`${ev.title}: ${opt.label} — ${outcome.text}`, cls: score>=0?'good':'bad', deltaStr: deltaText(outcome.d), score});
    state.barBias = opt.studyBias||0;
    return { text:outcome.text, cls: score>=0?'good':'bad', deltaStr: deltaText(outcome.d), next:'chain-intern_dilemma2' };
  }
  if(kind==='intern_dilemma2'){
    const opt = ev.options[optIndex];
    const outcome = pickOutcome(opt.outcomes);
    applyDelta(outcome.d);
    const score = sumDelta(outcome.d);
    state.log.unshift({year:1, text:`${ev.title}: ${opt.label} — ${outcome.text}`, cls: score>=0?'good':'bad', deltaStr: deltaText(outcome.d), score});
    return { text:outcome.text, cls: score>=0?'good':'bad', deltaStr: deltaText(outcome.d), next:'chain-bar_q1' };
  }
  if(kind==='bar_q2'){
    state.barEnjoy = ev.options[optIndex].score;
    const chance = 0.82 + state.barInvest*0.02 + state.barEnjoy*0.015 + state.barBias*0.01;
    let text, cls, deltaStr;
    if(Math.random() < chance){
      applyDelta({sanity:5});
      text = 'עברת את מבחני ההסמכה של הלשכה! מעכשיו את/ה עו״ד מוסמך/ת.'; cls='good'; deltaStr = deltaText({sanity:5});
      state.log.unshift({year:1, text, cls, deltaStr, score:5, milestone:true});
    } else {
      applyDelta({sanity:-8,money:-2000});
      text = 'נכשלת בניסיון הראשון. התאוששת, חזרת, ועברת בניסיון השני.'; cls='bad'; deltaStr = deltaText({sanity:-8,money:-2000});
      state.log.unshift({year:1, text, cls, deltaStr, score:-8});
    }
    return { text, cls, deltaStr, next:'finish' };
  }

  // normal / offer
  const opt = ev.options[optIndex];
  let outcomesToUse = opt.outcomes;
  let boostNote = '';
  if(boostOn && outcomesToUse && outcomesToUse.length>1){
    outcomesToUse = boostOutcomes(outcomesToUse);
    applyDelta({network:-15});
    boostNote = ' (הפעלת קשרים כדי להטות את הסיכויים)';
    state.log.unshift({year:state.year, text:'הפעלת קשרים כדי להטות את הסיכויים לטובתך.', cls:'good', deltaStr: deltaText({network:-15}), score:1});
  }
  const outcome = pickOutcome(outcomesToUse);

  if(outcome.instantEnd){
    applyDelta(outcome.d);
    state.log.unshift({year:state.year, text:`${ev.title}: ${opt.label} ← ${outcome.text}`, cls:'bad', score:-50, milestone:true});
    return { text:outcome.text, cls:'bad', deltaStr:'', next:`end:${outcome.instantEnd}` };
  }

  applyDelta(outcome.d);
  if(outcome.levelUp){ state.level = Math.min(state.level+outcome.levelUp, WORKPLACES[state.workplace].ladder.length-1); }
  if(outcome.moveTo){
    state.workplace = outcome.moveTo.workplace; state.level = outcome.moveTo.level;
    state.department = null; state.deptRank = null;
    state.firmRank = WORKPLACES[state.workplace].hasDept ? WORKPLACES[state.workplace].firmRankBase : null;
    state.clerkshipExtended = false;
    state.lastMoveYear = state.year;
  }
  if(outcome.flag) state.flags[outcome.flag] = true;
  if(outcome.levelUp || outcome.moveTo) recordCareerStep();
  const score = sumDelta(outcome.d);
  const isMilestone = !!(outcome.moveTo||outcome.levelUp);
  state.log.unshift({
    year:state.year, text:`${ev.title}: ${opt.label} ← ${outcome.text}`, cls: score>=0?'good':'bad',
    deltaStr: deltaText(outcome.d), score, milestone: isMilestone,
    outcomesRef: (isMilestone && opt.outcomes && opt.outcomes.length>1) ? opt.outcomes : null,
    eventTitle: ev.title, optLabel: opt.label,
  });
  if(outcome.jobSearchNext) state.needsJobSearch = true;
  return { text: outcome.text, cls: score>=0?'good':'bad', deltaStr: deltaText(outcome.d) + boostNote, next:'finish' };
}

function proceedAfterChoice(next){
  state.pendingEvent = null;
  if(next==='finish'){
    const forced = checkForcedEnd();
    if(forced){ state.pendingDecisionsCount = 0; endGame(forced); return; }
    if(state.pendingDecisionsCount && state.pendingDecisionsCount > 1){
      state.pendingDecisionsCount--;
      if(WORKPLACES[state.workplace].hasDept && !state.department && state.year>=3 && Math.random()<0.4){
        state.pendingEvent = departmentEvent(); state.pendingKind = 'department';
      } else {
        state.pendingEvent = drawDecision(); state.pendingKind = 'normal';
      }
      render(); return;
    }
    state.pendingDecisionsCount = 0;
    finishTurn(); return;
  }
  if(next==='chain-intern_dilemma2'){ state.pendingEvent = internDilemma2Event(); state.pendingKind = 'intern_dilemma2'; render(); return; }
  if(next==='chain-bar_q1'){ state.pendingEvent = barQ1Event(); state.pendingKind = 'bar_q1'; render(); return; }
  if(next && next.startsWith('end:')){ endGame(next.slice(4)); return; }
  finishTurn();
}

function sparklineSVG(history, key, color){
  if(!history || history.length<2) return '';
  const vals = history.map(h=>h[key]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const W=300, H=48;
  const pts = vals.map((v,i)=>{
    const x = (i/(vals.length-1))*W;
    const y = H - ((v-min)/range)*(H-6) - 3;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%; height:${H}px; display:block;"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function statChip(label, value, isMoney, isBar){
  const display = isMoney ? value.toLocaleString('he-IL') + ' ₪' : value;

  return `<div class="stat-chip"><div class="sl">${label}</div><div class="sv">${display}</div>${bar}</div>`;
}

            <div class="od">${o.internDesc}</div>
            <div class="origin-mini">
              <span>⏱ ${o.hours}</span>
              <span>🎯 ${o.responsibility}</span>
              <span>🎲 סיכוי הצעה: ${Math.round(o.offerChance*100)}%</span>
              <span>💰 ${WORKPLACES[o.id].salaries[0].toLocaleString('he-IL')} ₪/חודש</span>
              <span>🎓 ${o.training}</span>
              <span>🏢 ${o.culture}</span>
            </div>
          </div>`).join('')}
      </div>
      <h2 class="card-title" style="font-size:14px;">כל כמה זמן מתקבלת החלטה?</h2>
      <div class="pill-row" id="interval-options" style="flex-wrap:wrap;">
        <div class="pill" style="flex:1 1 45%;" data-v="3">כל 3 שנים — רגוע/ה</div>
        <div class="pill" style="flex:1 1 45%;" data-v="2">כל 2 שנים — מאוזן/ת</div>
        <div class="pill" style="flex:1 1 45%;" data-v="1">כל שנה — מעורב/ת</div>
        <div class="pill" style="flex:1 1 100%;" data-v="0">⚡ 3 בשנה — "אני תותח, אני משקיע אגרסיבי, אני לא מפחד/ת מכלום"</div>
      </div>
      <div class="pill-row" id="hard-options">
        <div class="pill ${!hardModeSelection?'selected':''}" data-v="0">מצב רגיל</div>
        <div class="pill ${hardModeSelection?'selected':''}" data-v="1">מצב קשה 🔥 (שפיות פתיחה נמוכה, בלאי קשרים כפול, סף השעיה מחמיר)</div>
      </div>
      <button class="btn" id="start-btn" ${!originSelection?'disabled':''}>התחל/י קריירה</button>
    </div>
  `;
  document.querySelectorAll('#origin-options .origin-card').forEach(el=>{
    el.onclick = ()=>{ originSelection = el.dataset.id; render(); };
  });
  document.querySelectorAll('#interval-options .pill').forEach(el=>{
    if(parseInt(el.dataset.v)===intervalSelection) el.classList.add('selected');
    el.onclick = ()=>{ intervalSelection = parseInt(el.dataset.v); render(); };
  });
  document.querySelectorAll('#hard-options .pill').forEach(el=>{
    el.onclick = ()=>{ hardModeSelection = el.dataset.v==='1'; render(); };
  });
  document.getElementById('start-btn').onclick = ()=>{
    if(!originSelection) return;
    state = newState(originSelection, intervalSelection, hardModeSelection);
    screen='game'; render();
  };
}

function renderGame(){
  saveGameProgress();
  if(state.ended) return renderEnd();
  const wp = WORKPLACES[state.workplace];
  const maxLevel = wp.ladder.length;
  const dots = Array.from({length:maxLevel}).map((_,i)=>`<div class="level-dot ${i<=state.level?'filled':''}"></div>`).join('');
  const placeLine = wp.name + (state.department ? ` · מחלקת ${DEPARTMENTS.find(d=>d.id===state.department).name}` : '');

  const rankParts = [];
  if(state.firmRank!=null) rankParts.push(`דירוג משרד: ${state.firmRank}`);
  if(state.deptRank!=null) rankParts.push(`דירוג מחלקה: ${state.deptRank}`);

  const logHTML = state.log.slice(0,8).map(l=>`
    <div class="log-entry ${l.cls}">
      <span class="lg-year">${seniorityLabel(l.year)}</span>
      ${l.text}
      ${l.deltaStr ? `<div class="lg-delta">${l.deltaStr}</div>`:''}
    </div>`).join('');

  app.innerHTML = `
    <div class="player-card">
      <div class="player-top">
        <div>
          <div class="player-name">${state.name}</div>
          <div class="player-role">${roleTitle()}</div>
          <div class="player-place">${placeLine}</div>
        </div>
        <div class="year-badge">${seniorityLabel(state.year)}</div>
      </div>
      <div class="level-dots">${dots}</div>
    </div>
    <div class="card">
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        ${statChip('שפיות', state.sanity, false, true)}
        ${statChip('קשרים', state.network, false, true)}
        ${statChip('תדמית ציבורית', state.publicRep, false, true)}
      </div>
      ${bdiInlineHTML(state.rep, rankParts, state.money)}
    </div>
    <div class="card">
      <h2 class="card-title" style="font-size:14px;">יומן קריירה</h2>
      <div class="log">${logHTML}</div>
      <button class="btn" id="next-year">השנה הבאה ←</button>
      ${state.year>=MIN_RETIRE_YEAR ? `<div style="margin-top:9px;"><button class="btn secondary" id="retire-btn">לפרוש עכשיו</button></div>` : ''}
    </div>
  `;
  document.getElementById('next-year').onclick = advanceYear;
  const bdiBtn = document.getElementById('bdi-info-btn');
  if(bdiBtn) bdiBtn.onclick = showBdiInfoModal;
  const retireBtn = document.getElementById('retire-btn');
  if(retireBtn) retireBtn.onclick = retireNow;

  if(state.pendingEvent){
    if(state.pendingEvent.forcedNarrative){ renderNarrativeModal(state.pendingEvent); }
    else { renderChoiceModal(state.pendingEvent, state.pendingKind); }
  }
}

function renderNarrativeModal(ev){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal"><div class="badge">${seniorityLabel(state.year)}</div><h3>${ev.title}</h3><p class="situation">${ev.situation}</p><button class="btn" id="ack-btn">להמשיך</button></div>`;
  document.body.appendChild(backdrop);
  document.getElementById('ack-btn').onclick = ()=>{ document.body.removeChild(backdrop); resolveNarrativeOnly(); };
}

function outcomesBadgesHTML(outcomes){
  if(!outcomes) return '';
  if(outcomes.length===1) return `<span class="cf">← ${outcomes[0].text}</span>`;
  const ranked = outcomes.map((o,i)=>({i, score:sumDelta(o.d)})).sort((a,b)=>b.score-a.score);
  const colorOf = {};
  ranked.forEach((r,rank)=>{ colorOf[r.i] = outcomes.length===2 ? (rank===0?'good':'bad') : (rank===0?'good':rank===ranked.length-1?'bad':'mid'); });
  return `<div class="odds-row">${outcomes.map((o,i)=>`<span class="odds-pill ${colorOf[i]}">${Math.round(o.p*100)}% — ${o.text}</span>`).join('')}</div>`;
}

function impactTag(ev){
  if(!ev.options) return '';
  const hasInstantEnd = ev.options.some(o=>o.outcomes && o.outcomes.some(x=>x.instantEnd));
  const hasMove = ev.options.some(o=>o.outcomes && o.outcomes.some(x=>x.moveTo));
  if(hasInstantEnd) return '☠️ סיכון קיצוני';
  if(hasMove || ev.isMajorMove) return '⚡ רגע מכריע';
  return '';
}

function renderChoiceModal(ev, kind){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const badgeMap = { department:'בחירת מחלקה', offer:'הצעת המשך', intern_dilemma:'שנה 1: התמחות', intern_dilemma2:'שנה 1: התמחות', bar_q1:'הכנה ללשכה', bar_q2:'הכנה ללשכה' };
  const badgeText = badgeMap[kind] || `החלטה — ${seniorityLabel(state.year)}`;
  const showOdds = kind==='normal' || kind==='offer' || kind==='intern_dilemma2';
  const canBoost = kind==='normal' && state.network>=15 && ev.options.some(o=>o.outcomes && o.outcomes.length>1);
  const tag = kind==='normal' ? impactTag(ev) : '';
  let boostOn = false;

  function drawChoose(){
    backdrop.innerHTML = `<div class="modal">
      <div class="badge">${badgeText}</div>${tag?`<span class="odds-pill ${tag.startsWith('☠')?'bad':'mid'}" style="margin-right:6px;">${tag}</span>`:''}<h3>${ev.title}</h3><p class="situation">${ev.situation}</p>
      ${canBoost ? `<button class="choice-btn" id="boost-toggle" style="border-color:${boostOn?'var(--accent)':'var(--border)'};background:${boostOn?'var(--accent-soft)':'var(--card-2)'};">🤝 ${boostOn?'קשרים מופעלים — לחץ/י לביטול':'להפעיל קשרים (עלות: 15) ולהטות את הסיכויים לטובתך'}</button>` : ''}
      ${ev.options.map((opt,i)=>{
        let odds = null;
        if(showOdds && opt.outcomes) odds = boostOn ? boostOutcomes(opt.outcomes) : opt.outcomes;
        const preview = odds ? outcomesBadgesHTML(odds) : (opt.sub ? `<span class="cf">${opt.sub}</span>` : '');
        return `<button class="choice-btn" data-i="${i}">${opt.label}${preview}</button>`;
      }).join('')}
    </div>`;
    const bt = backdrop.querySelector('#boost-toggle');
    if(bt) bt.onclick = ()=>{ boostOn = !boostOn; drawChoose(); };
    backdrop.querySelectorAll('.choice-btn').forEach(btn=>{
      if(btn.id==='boost-toggle') return;
      btn.onclick = ()=>{
        const idx = parseInt(btn.dataset.i);
        if(kind==='bar_q1'){
          state.barInvest = ev.options[idx].score;
          document.body.removeChild(backdrop);
          state.pendingEvent = barQ2Event(); state.pendingKind = 'bar_q2';
          render(); return;
        }
        const opt = ev.options[idx];
        const wasProbabilistic = showOdds && opt.outcomes && opt.outcomes.length>1;
        const result = computeChoice(idx, boostOn);
        if(wasProbabilistic) drawRolling(result); else drawResult(result);
      };
    });
  }

  function drawRolling(result){
    backdrop.innerHTML = `<div class="modal" style="text-align:center; padding:44px 20px;">
      <div class="dice-roll">🎲</div>
      <p class="situation" style="margin-top:14px;">מטילים קוביה...</p>
    </div>`;
    setTimeout(()=>drawResult(result), 550);
  }

  function drawResult(result){
    backdrop.innerHTML = `<div class="modal">
      <div class="badge">${result.cls==='good' ? 'תוצאה חיובית' : result.cls==='bad' ? 'תוצאה שלילית' : 'תוצאה'}</div>
      <h3>${ev.title}</h3>
      <p class="situation">${result.text}</p>
      ${result.deltaStr ? `<div class="lg-delta" style="font-size:13px; margin-bottom:16px;">${result.deltaStr}</div>` : ''}
      <button class="btn" id="continue-btn">להמשיך ←</button>
    </div>`;
    document.getElementById('continue-btn').onclick = ()=>{ document.body.removeChild(backdrop); proceedAfterChoice(result.next); };
  }

  drawChoose();
  document.body.appendChild(backdrop);
}

function buildShareText(){
  const e = ENDINGS[state.endingId];
  const school = (LAW_SCHOOLS.find(s=>s.id===state.school)||{}).name || 'מוסד לימוד לא ידוע';
  return `כמה עו״ד — סיכום הקריירה של ${state.name}\n${school} ← ${roleTitle()} ב${WORKPLACES[state.workplace].name}\n${seniorityYears(state.year)} שנות ותק · מוניטין מקצועי ${state.rep}\nסיום: ${genderize(e.title,state.gender)} (${e.badge})`;
}

function goalReflection(){
  if(!state.goal || state.goal==='undecided') return '';
  const wp = state.workplace;
  const hit = (state.goal==='partnership' && ['small_firm','large_firm','mega_firm'].includes(wp) && state.level>=WORKPLACES[wp].ladder.length-2)
    || (state.goal==='corporate' && wp==='corporate')
    || (state.goal==='academic' && wp==='academic')
    || (state.goal==='judge' && wp==='judge')
    || (state.goal==='independent' && wp==='independent');
  const goalName = (GOALS.find(g=>g.id===state.goal)||{}).name || 'מטרה לא ידועה';
  return hit
    ? `<div class="rank-line" style="margin-top:14px;">🎯 ביום הראשון אמרת "${goalName}". הגעת בדיוק לשם. לא לכולם יש את זה.</div>`
    : `<div class="rank-line" style="margin-top:14px;">🎯 ביום הראשון אמרת "${goalName}". הקריירה הלכה למקום אחר לגמרי — וזה קורה כמעט לכולם.</div>`;
}

function renderEnd(){
  const e = ENDINGS[state.endingId];

  const scored = state.log.filter(l=>typeof l.score==='number' && l.score!==0);
  const best = scored.filter(l=>l.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
  const worst = scored.filter(l=>l.score<0).sort((a,b)=>a.score-b.score).slice(0,3);

  const highlightsHTML = (best.length || worst.length) ? `
    <div class="card">
      <h2 class="card-title" style="font-size:14px;">רגעי מפתח</h2>
      <div class="log">
        ${best.map(l=>`<div class="log-entry good"><span class="lg-year">${seniorityLabel(l.year)} · שיא</span>${l.text}</div>`).join('')}
        ${worst.map(l=>`<div class="log-entry bad"><span class="lg-year">${seniorityLabel(l.year)} · שפל</span>${l.text}</div>`).join('')}
      </div>
    </div>` : '';

  const chartHTML = state.history.length>=3 ? `
    <div class="card">
      <h2 class="card-title" style="font-size:14px;">מגמת השפיות לאורך הקריירה</h2>
      ${sparklineSVG(state.history, 'sanity', 'var(--good)')}
    </div>` : '';

  const whatIfCandidates = state.log.filter(l=>l.outcomesRef).slice(0,5);
  const whatIfHTML = whatIfCandidates.length ? `
    <div class="card">
      <h2 class="card-title" style="font-size:14px;">מה היה קורה אם...?</h2>
      <p class="card-sub">הטלה מחדש לשם הסקרנות בלבד — לא משנה שום דבר בתוצאה שכבר קיבלת.</p>
      <div class="log">
        ${whatIfCandidates.map((l,idx)=>`
          <div class="log-entry">
            <span class="lg-year">${seniorityLabel(l.year)}</span>
            ${l.eventTitle}: ${l.optLabel}
            <div class="lg-delta" style="margin-top:4px;">בפועל: ${l.text}</div>
            <button class="link-btn whatif-btn" data-idx="${idx}" style="margin-top:6px;">🎲 להטיל שוב</button>
            <div id="whatif-result-${idx}"></div>
          </div>`).join('')}
      </div>
    </div>` : '';

  const pathHTML = `
    <div class="card">
      <h2 class="card-title" style="font-size:14px;">התחנות שעברת</h2>
      <div class="timeline">
        ${state.careerPath.map(st=>`
          <div class="timeline-item">
            <div class="ty">${seniorityLabel(st.year)}</div>
            <div class="tr">${st.role}</div>
            <div class="tp">${st.place}</div>
          </div>`).join('')}
      </div>
    </div>`;

  app.innerHTML = `
    <div class="card">
      <div class="end-badge">${e.badge}</div>
      <div class="end-title">${genderize(e.title, state.gender)}</div>
      <div class="end-desc">${genderize(e.desc, state.gender)}</div>
      ${goalReflection()}
      <div class="stat-grid" style="margin-bottom:4px;">
        ${statChip('שפיות', state.sanity, false, false)}
        ${statChip('קשרים', state.network, false, false)}
        ${statChip('שנות ותק', seniorityYears(state.year), false, false)}
        ${statChip('תדמית ציבורית', state.publicRep, false, false)}
      </div>
      ${bdiInlineHTML(state.rep, [], state.money)}
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn" id="play-again">קריירה חדשה</button>
        <button class="btn secondary" id="to-collection">🏆 לאוסף שלי</button>
      </div>
      <div style="margin-top:9px;"><button class="btn secondary" id="share-btn">📋 להעתיק סיכום לשיתוף</button></div>
    </div>
    ${chartHTML}
    ${highlightsHTML}
    ${whatIfHTML}
    ${pathHTML}
  `;
  document.getElementById('play-again').onclick = ()=>{ screen='gender'; playerGender=null; playerName=null; chosenSchool=null; selectedSchools=[]; chosenGoal=null; originSelection=null; selectedOrigins=[]; hardModeSelection=false; state=null; render(); };
  document.getElementById('to-collection').onclick = ()=>{ screen='collection'; render(); };
  const bdiBtn = document.getElementById('bdi-info-btn');
  if(bdiBtn) bdiBtn.onclick = showBdiInfoModal;
  document.getElementById('share-btn').onclick = (e2)=>{
    const text = buildShareText();
    const btn = e2.currentTarget;
    const done = ()=>{ const orig=btn.textContent; btn.textContent='הועתק! ✓'; setTimeout(()=>{btn.textContent=orig;},1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(done); }
    else { done(); }
  };
  document.querySelectorAll('.whatif-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.idx);
      const alt = pickOutcome(whatIfCandidates[idx].outcomesRef);
      document.getElementById('whatif-result-'+idx).innerHTML = `<div class="lg-delta" style="margin-top:2px;">↺ אם היו מטילים שוב: ${alt.text}</div>`;
    };
  });
}

function renderCollection(){
  const ids = Object.keys(ENDINGS);
  const unlockedCount = ids.filter(id=>collection.endings.includes(id)).length;
  const metaBadges = [];
  if(collection.gamesPlayed>0) metaBadges.push(`🎮 ${collection.gamesPlayed} קריירות שוחקו`);
  if(collection.fastestRun!=null) metaBadges.push(`⚡ הריצה הקצרה ביותר: ${collection.fastestRun} שנות ותק`);
  if(collection.lowSanitySurvivor) metaBadges.push(`💪 שרדת 5+ שנים ברצף עם שפיות מתחת ל-10`);
  app.innerHTML = `
    <div class="card">
      <div class="coll-count">${unlockedCount} מתוך ${ids.length} סיומי קריירה נחשפו</div>
      ${metaBadges.length ? `<div class="rank-line" style="margin-bottom:16px; text-align:right; line-height:1.9;">${metaBadges.join('<br>')}</div>` : ''}
      <div class="coll-grid">
        ${ids.map(id=>{
          const unlocked = collection.endings.includes(id);
          const e = ENDINGS[id];
          return `<div class="coll-card ${unlocked?'unlocked':'locked'}"><div class="ct">${unlocked ? e.title : '???'}</div><div class="cd">${unlocked ? e.badge : 'טרם התגלה'}</div></div>`;
        }).join('')}
      </div>
      <div style="margin-top:16px;"><button class="btn secondary" id="back-btn">חזרה</button></div>
    </div>
  `;
  document.getElementById('back-btn').onclick = ()=>{
    screen = state && !state.ended ? 'game' : (chosenSchool ? 'start' : (playerGender ? 'school' : 'gender'));
    render();
  };
}

/* ================= INIT ================= */

(async function init(){
  app.innerHTML = `<div class="card"><p class="card-sub">טוען...</p></div>`;
  document.getElementById('help-btn').onclick = showHelpModal;
  await loadCollection();
  await loadSavedProgress();
  if(savedProgress) screen = 'resume';
  render();
})();
</script>
</body>
</html>
